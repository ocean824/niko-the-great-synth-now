apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: synth-now-api
  namespace: synth-now
  annotations:
    # Set the ingress class and certificate automation annotations for your platform.
    kubernetes.io/ingress.class: nginx
spec:
  tls:
    - hosts: ["api.synthnow.example"]
      secretName: synth-now-api-tls
  rules:
    - host: api.synthnow.example
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: synth-now-api
                port:
                  name: http
---
# Requires metrics-server for CPU/memory and a Prometheus Adapter (or equivalent) for the external
# synthnow_api_rps metric. Tune the per-pod request target against a load-tested latency SLO.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synth-now-api
  namespace: synth-now
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synth-now-api
  minReplicas: 3
  maxReplicas: 24
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 4
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 300
      selectPolicy: Max
      policies:
        - type: Percent
          value: 25
          periodSeconds: 60
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 65
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 75
    - type: External
      external:
        metric:
          name: synthnow_api_rps
          selector:
            matchLabels:
              service: synth-now-api
        target:
          type: AverageValue
          averageValue: "20"
---
# Requires an external-metrics adapter that exposes synthnow_audio_job_queue_depth. AverageValue
# means the HPA seeks roughly 10 queued jobs per active worker, not 10 jobs cluster-wide.
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: synth-now-worker
  namespace: synth-now
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: synth-now-worker
  minReplicas: 1
  maxReplicas: 32
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 0
      selectPolicy: Max
      policies:
        - type: Pods
          value: 8
          periodSeconds: 60
        - type: Percent
          value: 100
          periodSeconds: 60
    scaleDown:
      stabilizationWindowSeconds: 600
      selectPolicy: Max
      policies:
        - type: Percent
          value: 20
          periodSeconds: 60
  metrics:
    - type: External
      external:
        metric:
          name: synthnow_audio_job_queue_depth
          selector:
            matchLabels:
              service: audio-worker
        target:
          type: AverageValue
          averageValue: "10"
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: synth-now-api
  namespace: synth-now
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: synth-now-api
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: synth-now-worker
  namespace: synth-now
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synth-now-worker
