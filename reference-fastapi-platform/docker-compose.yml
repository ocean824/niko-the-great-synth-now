services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: synthnow
      POSTGRES_USER: synthnow
      POSTGRES_PASSWORD: synthnow_dev_only_change_me
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./deploy/postgres-init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U synthnow -d synthnow"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--save", "60", "1000", "--requirepass", "redis_dev_only_change_me"]
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a redis_dev_only_change_me ping | grep PONG"]
      interval: 5s
      timeout: 3s
      retries: 20
    security_opt:
      - no-new-privileges:true

  api:
    build:
      context: .
    environment:
      DATABASE_URL: postgresql+psycopg://synthnow:synthnow_dev_only_change_me@postgres:5432/synthnow
      SYNTH_NOW_UPLOAD_DIR: /app/private_uploads
      SYNTH_NOW_REDIS_URL: redis://:redis_dev_only_change_me@redis:6379/0
      SYNTH_NOW_CACHE_ENABLED: "true"
      LOG_LEVEL: INFO
    ports:
      - "8000:8000"
    volumes:
      - private_uploads:/app/private_uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 10s
      timeout: 3s
      retries: 10
    security_opt:
      - no-new-privileges:true

  worker:
    build:
      context: .
    command: ["python", "-m", "app.worker"]
    environment:
      DATABASE_URL: postgresql+psycopg://synthnow:synthnow_dev_only_change_me@postgres:5432/synthnow
      SYNTH_NOW_UPLOAD_DIR: /app/private_uploads
      SYNTH_NOW_REDIS_URL: redis://:redis_dev_only_change_me@redis:6379/0
      SYNTH_NOW_CACHE_ENABLED: "true"
      SYNTH_NOW_WORKER_POLL_INTERVAL_SECONDS: "1"
      LOG_LEVEL: INFO
    volumes:
      - private_uploads:/app/private_uploads
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true

  alertmanager:
    image: prom/alertmanager:v0.28.1
    command:
      - --config.file=/etc/alertmanager/alertmanager.yml
      - --storage.path=/alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./deploy/monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      - ./deploy/monitoring/alertmanager/templates:/etc/alertmanager/templates:ro
      - ./deploy/monitoring/alertmanager/secrets:/etc/alertmanager/secrets:ro
      - alertmanager_data:/alertmanager
    security_opt:
      - no-new-privileges:true

  prometheus:
    image: prom/prometheus:v3.4.2
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-lifecycle
    ports:
      - "9090:9090"
    volumes:
      - ./deploy/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./deploy/monitoring/alerts.yml:/etc/prometheus/rules/alerts.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      api:
        condition: service_healthy
      alertmanager:
        condition: service_started
    security_opt:
      - no-new-privileges:true

  grafana:
    image: grafana/grafana:12.0.1
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana_dev_only_change_me
      GF_USERS_ALLOW_SIGN_UP: "false"
    ports:
      - "3000:3000"
    volumes:
      - ./deploy/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./deploy/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    security_opt:
      - no-new-privileges:true

volumes:
  postgres_data:
  private_uploads:
  redis_data:
  prometheus_data:
  alertmanager_data:
  grafana_data:
