# Development/staging Redis reference. For production HA, use a managed Redis service or Redis
# cluster with TLS, automatic failover, backups, and subnet-level access control.
apiVersion: v1
kind: Service
metadata:
  name: synth-now-redis
  namespace: synth-now
  labels:
    app.kubernetes.io/name: synth-now-redis
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: synth-now-redis
  ports:
    - name: redis
      port: 6379
      targetPort: redis
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: synth-now-redis
  namespace: synth-now
spec:
  serviceName: synth-now-redis
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synth-now-redis
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synth-now-redis
    spec:
      automountServiceAccountToken: false
      securityContext:
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: redis
          image: redis:7.4-alpine
          imagePullPolicy: IfNotPresent
          command: ["/bin/sh", "-c"]
          args:
            - exec redis-server --appendonly yes --save 60 1000 --requirepass "$REDIS_PASSWORD"
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: synth-now-redis-secret
                  key: REDIS_PASSWORD
          ports:
            - name: redis
              containerPort: 6379
          volumeMounts:
            - name: data
              mountPath: /data
          readinessProbe:
            exec:
              command: ["/bin/sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["/bin/sh", "-c", "redis-cli -a \"$REDIS_PASSWORD\" ping | grep PONG"]
            initialDelaySeconds: 15
            periodSeconds: 10
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "1"
              memory: "1Gi"
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: data
          emptyDir: {}
