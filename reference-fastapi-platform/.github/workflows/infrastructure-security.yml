name: Infrastructure and Supply Chain Security

on:
  pull_request:
    paths:
      - "infra/aws/**"
      - "deploy/**"
      - ".github/workflows/**"
      - "requirements.txt"
      - "Dockerfile"
  push:
    branches: [main]
    paths:
      - "infra/aws/**"
      - "deploy/**"
      - ".github/workflows/**"
      - "requirements.txt"
      - "Dockerfile"
  workflow_dispatch:

# Default deny. Jobs receive only the permissions they explicitly need.
permissions:
  contents: read

jobs:
  terraform-and-iac:
    name: Terraform Format, Validate, and Policy
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # Required only to upload Trivy SARIF.
    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.8.5"
          terraform_wrapper: false

      - name: Terraform format
        working-directory: infra/aws
        run: terraform fmt -check -recursive

      - name: Terraform init without remote state
        working-directory: infra/aws
        run: terraform init -backend=false -input=false

      - name: Terraform validate
        working-directory: infra/aws
        run: terraform validate -no-color

      - name: Local Terraform structure validation
        run: python3 tests/validate_terraform_assets.py

      - name: Checkov policy scan
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: infra/aws
          framework: terraform
          quiet: true
          soft_fail: false

      - name: Trivy IaC and secret scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: config,secret
          severity: HIGH,CRITICAL
          exit-code: "1"
          format: sarif
          output: trivy-iac.sarif

      - name: Upload Trivy SARIF
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: trivy-iac.sarif

  dependencies-and-workflows:
    name: Dependency, Secret, and Workflow Security
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Python dependency audit
        run: |
          python -m pip install --upgrade pip pip-audit
          pip-audit -r requirements.txt --strict

      - name: Gitleaks repository scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Zizmor GitHub Actions security lint
        run: |
          python -m pip install --upgrade zizmor
          zizmor .github/workflows --persona pedantic

      - name: Trivy container Dockerfile scan
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: config
          scan-ref: Dockerfile
          severity: HIGH,CRITICAL
          exit-code: "1"
