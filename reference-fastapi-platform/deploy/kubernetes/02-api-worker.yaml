apiVersion: v1
kind: Service
metadata:
  name: synth-now-api
  namespace: synth-now
  labels:
    app.kubernetes.io/name: synth-now-api
spec:
  selector:
    app.kubernetes.io/name: synth-now-api
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synth-now-api
  namespace: synth-now
spec:
  replicas: 2
  selector:
    matchLabels:
      app.kubernetes.io/name: synth-now-api
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synth-now-api
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: api
          image: registry.example.com/synth-now/evidence-api:0.1.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          envFrom:
            - configMapRef:
                name: synth-now-config
            - secretRef:
                name: synth-now-secret
          volumeMounts:
            - name: private-uploads
              mountPath: /app/private_uploads
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 2
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 30
            periodSeconds: 2
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1"
              memory: "2Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: private-uploads
          persistentVolumeClaim:
            claimName: synth-now-private-uploads
---
apiVersion: v1
kind: Service
metadata:
  name: synth-now-worker-metrics
  namespace: synth-now
  labels:
    app.kubernetes.io/name: synth-now-worker
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: synth-now-worker
  ports:
    - name: metrics
      port: 9100
      targetPort: metrics
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synth-now-worker
  namespace: synth-now
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: synth-now-worker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: synth-now-worker
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
      containers:
        - name: worker
          image: registry.example.com/synth-now/evidence-api:0.1.0
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "app.worker"]
          ports:
            - name: metrics
              containerPort: 9100
          envFrom:
            - configMapRef:
                name: synth-now-config
            - secretRef:
                name: synth-now-secret
          volumeMounts:
            - name: private-uploads
              mountPath: /app/private_uploads
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2"
              memory: "4Gi"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
      volumes:
        - name: private-uploads
          persistentVolumeClaim:
            claimName: synth-now-private-uploads
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: synth-now-private-uploads
  namespace: synth-now
spec:
  accessModes: ["ReadWriteMany"]
  resources:
    requests:
      storage: 20Gi
  # Requires an RWX-capable storage class. Replace local file flow with a private object-storage
  # adapter before running more than one API replica in production.
